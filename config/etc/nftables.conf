#!/usr/bin/nft -f
# ── AuchLinux laptop firewall ───────────────────────────────────────────────
# Default-drop inbound, allow all outbound. Tuned so it does NOT break IPv6
# (NDP), DHCP, or Tailscale.
#
# Apply:
#   sudo cp ~/auchlinux/config/etc/nftables.conf /etc/nftables.conf
#   sudo systemctl enable --now nftables
#   sudo nft -f /etc/nftables.conf        # load now without reboot
# Check:  sudo nft list ruleset
# Rollback: sudo systemctl disable --now nftables   (drops back to no firewall)

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # loopback (and block spoofed loopback from other interfaces)
        iif "lo" accept
        iif != "lo" ip  daddr 127.0.0.0/8 drop
        iif != "lo" ip6 daddr ::1         drop

        # replies to traffic we started
        ct state established,related accept
        ct state invalid drop

        # ICMPv4 — ping + path-MTU/diagnostics
        ip protocol icmp icmp type {
            echo-request, echo-reply,
            destination-unreachable, time-exceeded, parameter-problem
        } accept

        # ICMPv6 — REQUIRED for IPv6 to work (neighbor/router discovery)
        ip6 nexthdr icmpv6 icmpv6 type {
            echo-request, echo-reply,
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
            nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert,
            mld-listener-query, mld-listener-report, mld-listener-done
        } accept

        # DHCP client leases (IPv4 + IPv6) — so you get an IP on new networks
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp dport 546 accept

        # Trust the Tailscale mesh interface (device-to-device, shields-up still gates peers)
        iifname "tailscale0" accept

        # ── optional opt-ins — uncomment only if you need them ──────────────
        # mDNS (Chromecast / AirPlay / network-printer discovery):
        # udp dport 5353 accept
        # Steam Remote Play / LAN co-op:
        # udp dport 27031-27036 accept

        # anything else inbound -> dropped by policy
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # allow Tailscale subnet-route / exit-node forwarding if you ever use it
        iifname "tailscale0" accept
        oifname "tailscale0" accept
        ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
